spring.application.name=veterinaria-backend
# Puerto configurable por entorno (Render y otros hostings suelen inyectar
# PORT). Sin la variable se conserva el 8080 local/Docker.
server.port=${PORT:8080}

# Zona horaria del negocio: las horas de pagos, comandas y jornadas son
# LocalDateTime tomadas con now(). Se fija al arrancar (config/ZonaHorariaNegocio)
# para no depender de la zona del servidor, que en Docker o en la nube es UTC.
veterinaria.zona-horaria=${ZONA_HORARIA:America/Argentina/Buenos_Aires}

# characterEncoding=utf-8 es obligatorio: sin el, los literales con ñ/acentos
# (p.ej. el enum de conducta) se guardan corruptos en MySQL.
#
# Host y credenciales parametrizados por env con defaults locales (XAMPP):
# el mismo jar corre en dev (localhost, 3306, root sin password) y en Docker,
# donde docker-compose inyecta DB_HOST=db, DB_USERNAME=root y DB_PASSWORD=secreta.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/veterinaria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto detectado automaticamente por Hibernate a partir de la conexion.
# No se fija spring.jpa.database-platform: la propiedad explicita esta
# deprecada (HHH90000025) y la version que Reportaba (5.5.5) ya no existe en
# Hibernate 7. Persiste el warning HHH000511 por la autodeteccion, es cosmetico
# y no afecta el comportamiento. MySQL8Dialect no es una clase valida en
# Hibernate 7, asi que no hay forma de fijar el dialecto sin ese warning.
spring.jpa.hibernate.ddl-auto=update
# Logs SQL solo para depurar. En producción debe quedar apagado; se puede
# encender localmente con JPA_SHOW_SQL=true sin tocar este archivo.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Las relaciones se resuelven dentro de la transaccion del servicio (capa service).
# Con true, Jackson mantendria la sesion abierta y podria serializar proxies en lugar de DTOs.
spring.jpa.open-in-view=false

# El pool por defecto (10) es menor que la concurrencia que soporta el semaforo
# de aforo: con 15 reservas simultaneas, 5 hilos quedarian esperando una conexion
# y el test de concurrencia mediria el pool, no el lock. Se sube a 20 para que
# el limite real sea el aforo.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000

# Semilla de tarifas base (DataInitializer). Solo se aplica si la tabla tarifa
# esta vacia: si el mostrador ya cargo o edito precios, no se pisan. Cambiar
# estos valores y reiniciar no requiere recompilar; una vez sembradas, el precio
# vigente se edita con PUT /api/v1/comandas/tarifas/{concepto}.
veterinaria.tarifas.consulta-clinica=8000.00
veterinaria.tarifas.guarderia=10000.00
veterinaria.tarifas.otro=5000.00
# Autenticacion de empleados (JWT HS256).
# JWT_SECRET: minimo 32 bytes; el arranque falla si es mas corto. Sin definir, se
# genera una clave aleatoria en cada arranque (sesiones perdidas al reiniciar):
# en produccion es obligatoria. Nunca se versiona un valor por defecto.
# OWNER_USERNAME / OWNER_PASSWORD: cuenta inicial del Duenio, sembrada solo si no
# hay ningun Duenio activo; nace con cambio de contraseña obligatorio.
veterinaria.auth.jwt-secret=${JWT_SECRET:}
veterinaria.auth.token-horas=${JWT_HORAS:4}
# Issuer del JWT. Debe coincidir con el claim `iss` de los tokens emitidos;
# si se cambia, las sesiones abiertas dejan de valer (los tokens viejos no
# matchean). El default conserva los tokens actuales.
veterinaria.auth.jwt-issuer=${JWT_ISSUER:veterinaria-unla}
veterinaria.auth.owner-username=${OWNER_USERNAME:duenio}
veterinaria.auth.owner-password=${OWNER_PASSWORD:cambiar1234}
# Rate limiting extensible: almacenamiento 'memory' (local sin dependencias) o 'redis' (produccion).
veterinaria.auth.rate-limit.storage=${RATE_LIMIT_STORAGE:memory}
veterinaria.auth.rate-limit.redis-url=${REDIS_URL:}
# Limite para el par (usuario, IP)
veterinaria.auth.login-intentos-maximos=${LOGIN_INTENTOS_MAXIMOS:5}
veterinaria.auth.login-bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}
# Limite agregado por IP (anti-password spraying)
veterinaria.auth.login-ip-intentos-maximos=${LOGIN_IP_INTENTOS_MAXIMOS:20}
veterinaria.auth.login-ip-bloqueo-minutos=${LOGIN_IP_BLOQUEO_MINUTOS:15}
# Limite agregado por usuario (anti-ataque distribuido)
veterinaria.auth.login-usuario-intentos-maximos=${LOGIN_USUARIO_INTENTOS_MAXIMOS:15}
veterinaria.auth.login-usuario-bloqueo-minutos=${LOGIN_USUARIO_BLOQUEO_MINUTOS:15}
# Limite para cambio de password (por usuario autenticado / IP)
veterinaria.auth.cambio-password-intentos-maximos=${CAMBIO_PASSWORD_INTENTOS_MAXIMOS:5}
veterinaria.auth.cambio-password-bloqueo-minutos=${CAMBIO_PASSWORD_BLOQUEO_MINUTOS:15}

# Origenes CORS (lista separada por comas). Sin CORS_ORIGENES solo se aceptan
# los origenes locales de desarrollo; cualquier despliegue (Vercel, Render o
# hosting propio) debe definir la URL exacta de su frontend. Los comodines
# amplios tipo https://*.vercel.app se descartan con un aviso en el log.
# Ejemplo: CORS_ORIGENES=https://mi-veterinaria.vercel.app
veterinaria.cors.origenes=${CORS_ORIGENES:http://localhost:3000,http://127.0.0.1:3000}

# Importacion unica del Excel historico de Huellitas.
# Deshabilitada por defecto: el runner no toca nada salvo que se active a mano.
# Flujo recomendado:
#   1) habilitada=true, aplicar=false  -> genera reporte de simulacion
#   2) revisar datos/reporte-importacion-*-simulacion.md
#   3) habilitada=true, aplicar=true   -> escribe en la base y genera reporte
veterinaria.importacion.habilitada=false
veterinaria.importacion.archivo=../datos/Caso 3 Veterinaria_Huellitas_Datos_Historicos.xlsx
veterinaria.importacion.aplicar=false
