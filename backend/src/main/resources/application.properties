spring.application.name=veterinaria-backend
server.port=8080

# characterEncoding=utf-8 es obligatorio: sin el, los literales con ñ/acentos
# (p.ej. el enum de conducta) se guardan corruptos en MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialecto detectado automaticamente por Hibernate a partir de la conexion.
# No se fija spring.jpa.database-platform: la propiedad explicita esta
# deprecada (HHH90000025) y la version que Reportaba (5.5.5) ya no existe en
# Hibernate 7. Persiste el warning HHH000511 por la autodeteccion, es cosmetico
# y no afecta el comportamiento. MySQL8Dialect no es una clase valida en
# Hibernate 7, asi que no hay forma de fijar el dialecto sin ese warning.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Las relaciones se resuelven dentro de la transaccion del servicio (capa service).
# Con true, Jackson mantendria la sesion abierta y podria serializar proxies en lugar de DTOs.
spring.jpa.open-in-view=false

# El pool por defecto (10) es menor que la concurrencia que soporta el semaforo
# de aforo: con 15 reservas simultaneas, 5 hilos quedarian esperando una conexion
# y el test de concurrencia mediria el pool, no el lock. Se sube a 20 para que
# el limite real sea el aforo.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000