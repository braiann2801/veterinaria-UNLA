# ===========================================================================
# Configuracion de TESTS.
#
# Los tests corren contra una base PROPIA (veterinaria_test) y NUNCA contra
# veterinaria_db. Antes compartian la base de desarrollo: clases como
# RollbackTransaccionalTest hacen `DELETE FROM tarifa` (y de todas las tablas)
# en su @AfterEach, asi que correr la suite borraba los datos reales del
# mostrador. Este archivo resuelve el riesgo 7 de PROGRESS.md.
#
# Se usa MySQL y NO H2, deliberadamente: el aforo de guarderia y el cobro se
# apoyan en SQL nativo con SELECT ... FOR UPDATE
# (ControlAforoDiarioRepository, ComandaCobroRepository) y en el manejo
# explicito de innodb_lock_wait_timeout, y AforoConcurrenteTest mide el lock
# real. En H2 esas semantica cambiarian y los tests dejarian de probar lo que
# dicen probar; el esquema aislado mantiene el comportamiento identico.
#
# Este archivo reemplaza (no fusiona) al de src/main/resources: el classpath de
# test va primero, por lo que deben figurar todas las claves necesarias.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Mismo pool que produccion: con 15 reservas simultaneas, un pool de 10 haria
# que AforoConcurrenteTest mida el pool y no el lock.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000